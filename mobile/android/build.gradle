// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // ------------------------------------------------------------------
    // androidx.browser sürüm tavanı.
    //
    // Bu blok başta @capgo/capacitor-social-login yüzünden kondu (o eklenti
    // browser 1.9.0'ı SABİT istiyordu ve sınıf yolu çakışması çıkarıyordu).
    // Aşama 5'te eklenti tamamen söküldü; blok bir EMNİYET olarak duruyor:
    //
    //   browser 1.9.0 ve üstü aar-metadata'da minCompileSdk=36 istiyor, biz
    //   compileSdk 35'teyiz. Herhangi bir bağımlılık ileride 1.9.0 çekerse
    //   build "compile against version 36 or later" diye patlar; bu force onu
    //   1.8.0'a sabitleyip önler. Sürüm variables.gradle'da tek yerde durur.
    //
    // NE ZAMAN KALDIRILIR: compileSdk 36'ya çıkıldığında.
    // ------------------------------------------------------------------
    configurations.all {
        resolutionStrategy {
            force "androidx.browser:browser:${rootProject.ext.androidxBrowserVersion}"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
